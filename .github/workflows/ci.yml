name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # Separate steps, not `poe check`: its parallel block ends in a bare `wait`,
      # which exits 0 even when a check fails.
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run ty check
      - name: Test smells
        run: uv run zorilla check .
      - name: Clones
        run: uv run biston scan .
      - name: Vulnerabilities
        run: uvx pysentry-rs .
      # Offline end-to-end export included; never calls the AA API.
      - name: Tests
        run: uv run pytest -q --tb=short
