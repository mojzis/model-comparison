name: Publish AA chart

# Rebuilds when the model list (config.toml) or the chart code changes on main, or
# on manual dispatch (e.g. to pick up fresh AA scores). The bot's commit-back push
# uses GITHUB_TOKEN, which doesn't trigger workflows, so this can't loop.
on:
  push:
    branches: [main]
    paths:
      - config.toml
      - aa_chart.py
      - src/aa_lib/**
      - scripts/run_daily.sh
      - uv.lock
  workflow_dispatch:

permissions:
  contents: write # commit data/ and out/ back
  pages: write
  id-token: write

concurrency:
  group: publish-aa-chart
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Fetch, build and export
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: scripts/run_daily.sh

      # Runs even when the build failed, so a fetched raw snapshot is kept and a
      # manual re-run doesn't spend API quota again. On failure run_daily.sh leaves
      # out/ untouched, so only data/raw can change.
      - name: Commit data and pages
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data out
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "AA snapshot $(date -u +%F)"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
