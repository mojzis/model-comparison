# Configuration for aa_chart.py. Paths are relative to the repo root; the env vars
# AA_DATA_DIR and AA_OUT_DIR override data_dir / out_dir (used by tests).

[api]
url = "https://artificialanalysis.ai/api/v2/language/models/free"
timeout_s = 30

[paths]
data_dir = "data"  # raw/ and tidy/ live under this
out_dir = "out"    # chart.html is written here

[chart]
title = "Intelligence vs cost: Claude and OpenAI models"
dashes = ["solid", "dash", "dot", "dashdot", "longdash"]

# One table per vendor, keyed by AA's `model_creator.name`. Order here is the
# left-to-right order in the ladder chart. `families` is the allowlist of current
# families, in legend order; leave it empty to keep every family of that vendor
# (the free API has no current/deprecated status field).
[vendors.Anthropic]
label = "Claude"
palette = ["#3C3489", "#534AB7", "#7F77DD", "#AFA9EC", "#8C88B4"]
families = ["Fable 5.1", "Opus 5.5", "Sonnet 5.5", "Haiku 5.5", "Haiku 4.5"]

[vendors.OpenAI]
label = "OpenAI"
palette = ["#085041", "#0F6E56", "#1D9E75", "#5DCAA5"]
families = ["GPT-6.1 Sol", "GPT-6 Astra", "GPT-6 Luna", "GPT-5.6 Terra"]
